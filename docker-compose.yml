services:
  db:
    image: postgres:16-alpine
    container_name: okan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: okan
      POSTGRES_PASSWORD: okan
      POSTGRES_DB: okan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: